name: Bench

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Set up Leiningen
        run: |
          curl -fsSL https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein -o /usr/local/bin/lein
          chmod +x /usr/local/bin/lein
          lein version
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/project.clj') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-contrib
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER hypermedia WITH PASSWORD 'hypermedia';"
          sudo -u postgres psql -c "CREATE DATABASE hypermedia OWNER hypermedia;"
      - name: Run benchmarks
        run: lein bench run
        env:
          LEIN_SNAPSHOTS_IN_RELEASE: allow
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: target/bench/
          retention-days: 30